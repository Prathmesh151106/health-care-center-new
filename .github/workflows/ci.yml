name: Daily Health Companion Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_user
          POSTGRES_PASSWORD: health_password
          POSTGRES_DB: health_companion_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@health-care-center/api

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://health_user:health_password@localhost:5432/health_companion_dev?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret_0123456789abcdef0123456789
          JWT_REFRESH_SECRET: test_refresh_secret_0123456789abcdef0123456789
          CLIENT_ORIGIN: http://localhost:5173
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LLM_PROVIDER: mock
        run: npm test

      - name: Build All Workspaces
        run: npm run build
